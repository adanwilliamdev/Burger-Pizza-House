{% extends "base.html" %}
{% block title %}Novo usuário{% endblock %}
{% block content %}
<div class="max-w-lg">
    <h1 class="text-page-title mb-6">Novo usuário</h1>
    <form method="post" class="card p-6 space-y-4">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<p class="text-sm text-red-600 mt-1">{{ field.errors.0 }}</p>{% endif %}
        </div>
        {% endfor %}
        <div class="flex gap-2 pt-2">
            <button type="submit" class="btn-primary">Criar usuário</button>
            <a href="{% url 'accounts:user_list' %}" class="btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
