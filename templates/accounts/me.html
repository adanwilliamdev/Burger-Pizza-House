{% extends "base.html" %}
{% block title %}Meu perfil{% endblock %}
{% block content %}
<h1 class="text-page-title mb-6">Meu perfil</h1>
<div class="card p-6 max-w-md space-y-2 text-sm">
    <p><span class="text-gray-500">Nome:</span> <strong>{{ user_obj.name }}</strong></p>
    <p><span class="text-gray-500">E-mail:</span> {{ user_obj.email }}</p>
    <p><span class="text-gray-500">Papel:</span> {{ user_obj.get_role_display }}</p>
</div>
{% endblock %}
