<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ops — Burger &amp; Pizza House</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="error-wrap">
  <div class="card mw-420 w-full">
    <div class="card-body stack-sm text-center p-32">
      <p class="display error-code" th:text="${status} ?: 'Erro'">404</p>
      <h1 class="fs-18" th:switch="${status}">
        <span th:case="403">Você não tem permissão para acessar esta página.</span>
        <span th:case="404">Página não encontrada.</span>
        <span th:case="*">Algo deu errado. Tente novamente.</span>
      </h1>
      <a class="btn self-center" th:href="@{/dashboard}">Voltar ao início</a>
    </div>
  </div>
</div>
</body>
</html>
