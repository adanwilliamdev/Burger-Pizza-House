spring:
  application:
    name: burger-pizza-house
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/burger_pizza_house}
    username: ${DATABASE_USER:bph_user}
    password: ${DATABASE_PASSWORD:bph_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379/0}
      # O Redis é usado só via StringRedisTemplate; sem repositórios Spring Data para Redis.
      repositories:
        enabled: false
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
  web:
    locale: pt_BR

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs

app:
  env: ${APP_ENV:development}
  # Fuso que define "hoje" e o agrupamento por dia no dashboard.
  business-timezone: ${BUSINESS_TIMEZONE:America/Sao_Paulo}
  # Origens autorizadas a chamar a API a partir de outro domínio (separadas por vírgula). Vazio = só mesma origem.
  cors-origins: ${CORS_ORIGINS:}
  jwt:
    secret: ${JWT_SECRET_KEY:troque-esta-chave-em-producao-para-algo-aleatorio-e-longo}
    access-token-expire-minutes: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:60}
    refresh-token-expire-days: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:7}
  # Anti força bruta no login
  login:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    lock-seconds: ${LOGIN_LOCK_SECONDS:900}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    admin-password: ${SEED_ADMIN_PASSWORD:admin123}
