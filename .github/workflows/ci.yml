name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bph_user
          POSTGRES_PASSWORD: bph_password
          POSTGRES_DB: burger_pizza_house
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bph_user -d burger_pizza_house"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/burger_pizza_house
      DATABASE_USER: bph_user
      DATABASE_PASSWORD: bph_password
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # testes unitários (surefire) + integração com concorrência real (failsafe)
      - run: mvn -B verify
